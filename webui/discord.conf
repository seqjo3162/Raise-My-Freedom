use_relay=1
# 1 = рвать SNI. Это НЕ плата за обход, а сам обход: замерено в обоих
#    состояниях сети.
#      сеть открыта:  split_ch=0 -> styles.css 782354 целиком
#                     split_ch=1 -> обрыв на ~20 КБ
#      сеть закрыта:  split_ch=0 -> 0 байт, НИЧЕГО не проходит
#                     split_ch=1 -> 205080 Б, работает
#    То есть без разрыва в закрытом состоянии Discord недоступен целиком.
#    Дефолт 1: частичный обход лучше полного отсутствия обхода.
#
# 0 = рель пропускает байты. Даёт целый поток, когда сеть открыта, и ничего,
#    когда закрыта. Имеет смысл только если ты знаешь, что сеть открыта.
#    Проверить одной командой: ./scripts/discord-asset-check.sh
split_ch=1

# 1 = модуль сам выбирает режим разрыва SNI по фактической замерке.
#
# Замер настоящий: модуль открывает TLS по тому же адресу и порту, куда
# пойдёт клиент, через те же правила REDIRECT и тот же рель с перебором
# кандидатов, и считает, сколько данных пришло. Оба варианта проверяются,
# остаётся тот, где больше.
#
# Первая попытка строилась на пробе site_probe_sni и была отброшена: на одном
# адресе с одним SNI проба то отвечала, то молчала, то есть давала ложные
# отрицания. Настоящий TLS рукопожатие устойчиво ставит.
#
# Цена: включение модуля занимает на ~10-15 с дольше — столько стоят две
# замеры. Если это неприемлемо, поставь 0 и решай руками.
auto_split=1
frag_delay_ms=30
frag_first_seg=20
# split_data: НЕ ВКЛЮЧАТЬ. Дробление записей данных ломает TLS — клиент
# получает "decryption failed or bad record mac". Проверено на стенде реля
# без участия ТСПУ, 0 из 5 прогонов доходят целиком. Ломается, как только
# хоть одна запись реально делится; при split_size >= 1400 записи по 1386 Б
# не делятся и потому всё выглядит исправным — это ловушка, а не исправление.
# Модуль предупредит в лог, если значение всё же выставят в 1.
split_data=0
split_size=512
split_delay_ms=0
relay_chunk=0
# -1 = без пауз между порциями. 0 НЕ значит «выключено»: sni_relay трактует
# 0 как 1 мс, и весь трафик режется по 4096 Б с паузой — на загрузке в
# 100 МБ это ~25 600 срезов и ~25 с чистой задержки. Собственный обход
# Discord держится на разрыве ClientHello, а не на темпе данных, поэтому
# паузы не нужны. Значение > 0 включает их обратно.
relay_pause_ms=-1
shift_sni=0
no_split_hs=1
multi_parts=2
relay_cidr=0
probe_pins=0
